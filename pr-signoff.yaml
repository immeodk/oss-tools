# This repo's own pr-signoff configuration — used by
# .github/workflows/dogfood-signoff.yml to validate this repo's own PRs with
# pr-signoff itself.
minToolVersion: '2.0.0'

github:
  owner: immeodk
  repo: oss-tools

signoff:
  policyName: oss-tools CI
  scopeToFolder: false
  defaultSignoffMethod: pipeline
  commands:
    - npm ci
    - npm run type-check
    - npm run lint
    - npm run format:check
    - npm test
    - npm run build
