name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # for npm provenance + Trusted Publishing OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    # Must match the environment name configured on each package's npm
    # Trusted Publisher settings — npm validates the OIDC token's environment
    # claim against it, so a mismatch (or missing this line) makes OIDC
    # publishing fail even with id-token: write set above.
    environment: NPM
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm CLI >= 11.5.1; Node 22's bundled
      # npm may be older than that.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm test

      # Opens/updates a "Version Packages" PR when there are unreleased
      # changesets; once that PR is merged, this step publishes every package
      # whose version changed. See .changeset/config.json for versioning rules.
      # No NPM_TOKEN — publishing authenticates via Trusted Publishing (OIDC),
      # using the id-token permission and environment above instead of a
      # long-lived secret.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
