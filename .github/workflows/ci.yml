name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node-version }}'
          cache: npm

      - run: npm ci

      - run: npm run type-check

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - run: npm run build
