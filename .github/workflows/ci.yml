name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node-version }}'
          cache: npm

      - run: npm ci

      # Build first: pr-signoff imports @immeodk/git-utils and
      # @immeodk/schema-tools from their compiled dist/, not source (see
      # CONTRIBUTING.md) — every step below needs that dist/ to already
      # exist, or pr-signoff's own type-check/test/lint fails to resolve
      # those modules on a clean checkout.
      - run: npm run build

      - run: npm run type-check

      - run: npm run lint

      - run: npm run format:check

      - run: npm test
